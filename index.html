const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const b64u=u=>b64(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return unb64(s)};

const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('jpso_lic_db',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const iget=async k=>{const d=await idb();return new Promise((ok,no)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})};
const iput=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})};

function fonts(){try{const s=document.createElement('span');s.textContent='mmmmmmmmmmlliWW@#0123456789';s.style.cssText='position:absolute;left:-9999px;top:0;font-size:72px;visibility:hidden';document.body.appendChild(s);const w=f=>{s.style.fontFamily=f;return s.offsetWidth+'x'+s.offsetHeight};const base=['monospace','serif','sans-serif'].map(w);let r='';FONTS.forEach(f=>{r+=['monospace','serif','sans-serif'].map((b,i)=>w("'"+f+"',"+b)!==base[i]).some(Boolean)?'1':'0'});s.remove();return r}catch(x){return'nofont'}}
function canv(){try{const c=document.createElement('canvas');c.width=240;c.height=60;const x=c.getContext('2d');x.textBaseline='top';x.font='16px sans-serif';x.fillText('BIP Absensi 0123 \u00c5\u00d6\u2713 \u20ac',4,4);x.font='italic 18px serif';x.fillText('Perangkat \u00e9\u00f1\u00fc',4,30);return c.toDataURL()}catch(x){return'nocanvas'}}
const h8=async t=>new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(t))).slice(0,8);
async function device(){const nv=navigator;
 const A=['rkp-gpu',gpu()].join('|'),B=['rkp-sys',nv.platform||'',nv.hardwareConcurrency||0,nv.deviceMemory||0,nv.maxTouchPoints||0].join('|'),C=['rkp-font',fonts()].join('|'),D=['rkp-canvas',canv()].join('|');
 const parts=[await h8(A),await h8(B),await h8(C),await h8(D)],all=new Uint8Array(32);parts.forEach((p,i)=>all.set(p,i*8));
 return{code:b64u(all),parts}}
function cocok(dp,dev){let raw;try{raw=unb64u(dp)}catch(e){return 0}if(raw.length!==32)return 0;let n=0;for(let i=0;i<4;i++){let same=true;for(let k=0;k<8;k++)if(raw[i*8+k]!==dev.parts[i][k]){same=false;break}if(same)n++}return n}
async function check(tok,dev){
 const p=String(tok).replace(/\s+/g,'').split('.');if(p.length!=3||p[0]!='RKP1')throw new Error('Format kode lisensi tidak dikenali.');
 let bodyB,sig;try{bodyB=unb64u(p[1]);sig=unb64u(p[2])}catch(e){throw new Error('Format kode lisensi tidak dikenali.')}
 const vk=await crypto.subtle.importKey('jwk',VK,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
 if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},vk,sig,bodyB))throw new Error('Kode lisensi tidak valid.');
 const b=JSON.parse(dec.decode(bodyB));
 if(cocok(b.dp,dev)<3)throw new Error('Kode lisensi ini dibuat untuk perangkat lain.');
 const t=today();let seen='';try{seen=localStorage.getItem('jpso_seen')||''}catch(e){}
 if(b.e){if(seen&&t<seen)throw new Error('Tanggal komputer lebih awal dari pemakaian sebelumnya. Perbaiki tanggal komputer.');
  if(t>b.e)throw new Error('Lisensi sudah berakhir pada '+dmy(b.e)+'.')}
 const wk=await crypto.subtle.importKey('raw',await crypto.subtle.digest('SHA-256',enc.encode('rkp-wrap|'+b.dp)),'AES-GCM',false,['decrypt']);
 const K=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(b.iv)},wk,unb64u(b.ct));
 const ak=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
 const html=dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(IV)},ak,unb64(PL)));
 try{if(!seen||t>seen)localStorage.setItem('jpso_seen',t)}catch(e){}
 return{b,html}}
async function run(r){const b=r.b;if(document.readyState!=='complete')await new Promise(ok=>window.addEventListener('load',ok,{once:true}));await new Promise(ok=>setTimeout(ok,0));document.open();document.write(r.html);document.close();
 setTimeout(()=>{try{const st=document.createElement('style');st.textContent='@media print{.lic-np{display:none!important}}';document.head.appendChild(st);const d=document.createElement('div');d.className='lic-np';d.style.cssText='text-align:center;font:12px system-ui,Arial;color:#667085;padding:8px';d.textContent='Berlisensi: '+b.h+(b.id?' · ID '+b.id:'')+' · '+(b.e?'berlaku s/d '+dmy(b.e):'tanpa batas waktu');document.body.appendChild(d)}catch(e){}
  try{if(!b.e)return;const T=today().split('-').map(Number),E=b.e.split('-').map(Number),n=Math.round((Date.UTC(E[0],E[1]-1,E[2])-Date.UTC(T[0],T[1]-1,T[2]))/864e5);if(n>30)return;
   const w=document.createElement('div'),red=n<=7;w.className='lic-np';w.style.cssText='position:sticky;top:0;z-index:99999;display:flex;gap:12px;align-items:center;justify-content:center;padding:10px 14px;font:14px/1.4 system-ui,Arial;border-bottom:1px solid '+(red?'#f1a9a4':'#e6cf7a')+';background:'+(red?'#fde2e1':'#fff1b8')+';color:'+(red?'#912018':'#6b5000');
   const t=document.createElement('span');t.textContent=n<=0?'Lisensi berakhir HARI INI ('+dmy(b.e)+'). Hubungi penyedia aplikasi untuk perpanjangan.':'Lisensi akan berakhir dalam '+n+' hari ('+dmy(b.e)+'). Hubungi penyedia aplikasi untuk perpanjangan.';
   const x=document.createElement('button');x.textContent='Tutup';x.style.cssText='font:inherit;padding:2px 10px;border-radius:6px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer';x.onclick=()=>w.remove();
   w.appendChild(t);w.appendChild(x);document.body.insertBefore(w,document.body.firstChild)}catch(e){}},500)}
(async()=>{
 let dev;try{dev=await device()}catch(e){msg('Browser ini tidak mendukung pembuatan kode perangkat. Gunakan Chrome atau Edge versi terbaru.',1);return}
 $('dc').value=dev.code;
 $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(dev.code);msg('Kode Perangkat disalin.')}catch(e){$('dc').select();msg('Salin manual: Ctrl+C.')}};
 $('go').onclick=async()=>{const t=$('lc').value;try{const r=await check(t,dev);try{localStorage.setItem('jpso_lic',t.replace(/\s+/g,''))}catch(e){}run(r)}catch(e){msg(e.message||String(e),1)}};
 let tok='';try{tok=localStorage.getItem('jpso_lic')||''}catch(e){}
 if(!tok)tok=LIC0;
 if(tok){try{run(await check(tok,dev))}catch(e){msg(e.message,1)}}
})();
})();
